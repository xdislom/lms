services:
  db:
    image: postgres:15
    container_name: itlive_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: itLive
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - itlive

  backend:
    build:
      context: ./backend
    container_name: itlive_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/itLive
    depends_on:
      - db
    command: >
      sh -c "npx prisma migrate deploy && npm run start:prod"
    volumes:
      - backend_uploads:/app/src/uploads
    networks:
      - itlive

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: itlive_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - itlive

  nginx:
    image: nginx:stable-alpine
    container_name: itlive_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - itlive

volumes:
  db_data:
  backend_uploads:

networks:
  itlive:
    driver: bridge
